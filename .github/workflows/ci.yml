name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"

      - name: Install Beamtalk
        run: |
          # Pinned to v0.4.0: the nightly feed churned hourly on 2026-11-06
          # (formatter canonical drift, then rejection of hpack 0.1.1's
          # `_:5` bitstring syntax, which this package depends on via
          # buccaneer). Revert to --nightly once the feed is stable again.
          curl -fsSL https://beamtalk.dev/install.sh | sudo sh -s -- --version v0.4.0 --prefix /usr/local
          beamtalk --version

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Format check
        run: just fmt

      - name: Lint
        run: just lint
        continue-on-error: true

      - name: Build
        run: just build

      - name: Test
        run: just test
